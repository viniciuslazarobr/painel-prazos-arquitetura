    // Helper: Submeter busca com processo já preenchido diretamente no portal do DOSP em nova aba
    function openDospFilteredPost(processNumber) {
      if (!processNumber) {
        window.open('https://diariooficial.prefeitura.sp.gov.br/md_epubli_controlador.php?acao=materias_pesquisar', '_blank', 'noopener,noreferrer');
        return;
      }
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = 'https://diariooficial.prefeitura.sp.gov.br/md_epubli_controlador.php?acao=materias_pesquisar';
      form.target = '_blank';

      const fields = {
        hdnTermoPesquisa: processNumber.trim(),
        hdnTipoPesquisa: 'E',
        hdnVersaoDiario: 'A',
        hdnOndePesquisa: 'C',
        hdnTipoDataPesquisa: 'I',
        hdnDataInicioPesquisa: '',
        hdnDataFimPesquisa: '',
        hdnTipoDocumentoPesquisa: '',
        hdnVeiculoPublicacao: '',
        hdnDataPublicacao: '',
        hdnOrgaoFiltro: '',
        hdnUnidadeResponsavelFiltro: '',
        hdnTipoDocumentoFiltro: '',
        hdnInicio: '0',
        hdnVisualizacao: 'L',
        hdnModoPesquisa: 'RAPIDA'
      };

      for (const [key, val] of Object.entries(fields)) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = val;
        form.appendChild(input);
      }

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
    }

    // Sintetizador Nativo de Alerta Sonoro (Web Audio API)
    // Toca dois tons harmônicos suaves idênticos ao Google Calendar / Slack sem depender de arquivos MP3
    function playNotificationChime() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const now = ctx.currentTime;

        // Tom 1: Re5 (587.33 Hz)
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, now);
        gain1.gain.setValueAtTime(0.12, now);
        gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.18);

        // Tom 2: La5 (880.00 Hz)
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880, now + 0.1);
        gain2.gain.setValueAtTime(0.18, now + 0.1);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.1);
        osc2.stop(now + 0.45);
      } catch (e) {
        // Ignora silenciosamente se o navegador restringir áudio automático
      }
    }

    // Helper de Notificação Nativa do Navegador (Estilo Google Notificações)
    function sendBrowserNotification(title, body, tag = 'prazos-alert') {
      playNotificationChime();
      if (typeof window !== 'undefined' && 'Notification' in window && Notification.permission === 'granted') {
        try {
          const notif = new Notification(title, {
            body: body,
            icon: 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>',
            tag: tag,
            renotify: true
          });
          notif.onclick = () => {
            window.focus();
            notif.close();
          };
        } catch (err) {
          console.warn('[Notification Error]', err);
        }
      }
    }

    // Componente Principal do Dashboard
    function DashboardApp() {
      // Tema Claro / Escuro
      const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'dark');

      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('theme', theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));

      const [loading, setLoading] = useState(true);
      const [isRealtimeActive, setIsRealtimeActive] = useState(true);
      const [data, setData] = useState({
        metrics: { total: 0, pending: 0, overdue: 0, today: 0, next7Days: 0, completed: 0 },
        memberStats: {},
        teamMembers: [],
        processes: [],
        todaySaoPaulo: ''
      });
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedMember, setSelectedMember] = useState('ALL');
      const [statusFilter, setStatusFilter] = useState('PENDENTE'); // ALL, PENDENTE, ATRASADO, HOJE, SEMANA, CONCLUIDO
      const [sortBy, setSortBy] = useState('urgency'); // urgency, created_desc, client_asc
      const [viewMode, setViewMode] = useState('table'); // table, cards
      const [toast, setToast] = useState(null);

      // Estados de Modais
      const [isNewModalOpen, setIsNewModalOpen] = useState(false);
      const [newForm, setNewForm] = useState({
        process_number: '',
        client_name: '',
        deadline_info: '',
        owner_name: '',
        owner_telegram_id: '',
        due_date: '',
        remind_days_before: 3,
      });
      const [submittingNew, setSubmittingNew] = useState(false);

      // Modal de Edição / Prorrogação de Prazo
      const [editingItem, setEditingItem] = useState(null);
      const [editForm, setEditForm] = useState({
        id: null,
        process_number: '',
        client_name: '',
        deadline_info: '',
        owner_name: '',
        due_date: '',
      });
      const [submittingEdit, setSubmittingEdit] = useState(false);

      // Modal de Baixa
      const [completingItem, setCompletingItem] = useState(null);
      const [completingUser, setCompletingUser] = useState('');
      const [submittingComplete, setSubmittingComplete] = useState(false);

      // Autenticação de Acesso ao Painel
      const [authToken, setAuthToken] = useState(() => localStorage.getItem('prazos_token') || '');
      const [authUser, setAuthUser] = useState(() => localStorage.getItem('prazos_user') || '');

      const handleLoginSuccess = (token, user) => {
        localStorage.setItem('prazos_token', token);
        localStorage.setItem('prazos_user', user);
        setAuthToken(token);
        setAuthUser(user);
      };

      const handleLogout = () => {
        localStorage.removeItem('prazos_token');
        localStorage.removeItem('prazos_user');
        setAuthToken('');
        setAuthUser('');
      };

      // Notificações Nativas do Navegador (Estilo Google Notificações)
      const [notifStatus, setNotifStatus] = useState(() => {
        if (typeof window !== 'undefined' && 'Notification' in window) {
          return Notification.permission;
        }
        return 'unsupported';
      });

      const handleToggleNotifications = async () => {
        if (typeof window === 'undefined' || !('Notification' in window)) {
          showToast('Notificações nativas não são suportadas neste navegador.', 'error');
          return;
        }

        if (Notification.permission === 'granted') {
          sendBrowserNotification(
            '🔔 Notificações Ativas!',
            'Você receberá alertas no navegador (estilo Google) sempre que houver prazos vencendo ou novos cadastros.'
          );
          showToast('Notificações no navegador já estão ativas!', 'success');
          return;
        }

        try {
          const perm = await Notification.requestPermission();
          setNotifStatus(perm);
          if (perm === 'granted') {
            sendBrowserNotification(
              '🔔 Alertas do Navegador Ativados!',
              'Pronto! Você será alertado no navegador sobre prazos e vencimentos de arquitetura.'
            );
            showToast('Alertas do navegador ativados com sucesso!', 'success');
          } else {
            showToast('Permissão de notificações não foi concedida no navegador.', 'error');
          }
        } catch (err) {
          showToast('Erro ao ativar notificações: ' + err.message, 'error');
        }
      };

      const authFetch = async (url, options = {}) => {
        const headers = {
          'Content-Type': 'application/json',
          ...(authToken ? { 'Authorization': `Bearer ${authToken}` } : {}),
          ...(options.headers || {}),
        };
        const res = await fetch(url, { ...options, headers });
        if (res.status === 401) {
          handleLogout();
        }
        return res;
      };

      // Modal de Consulta DOSP (Sem sair do painel)
      const [dospModal, setDospModal] = useState({
        open: false,
        processNumber: '',
        clientName: '',
        loading: false,
        result: null,
        error: null
      });

      const openDospModal = async (proc) => {
        if (!proc || !proc.process_number) return;
        setDospModal({
          open: true,
          processNumber: proc.process_number,
          clientName: proc.client_name || '',
          loading: true,
          result: null,
          error: null
        });

        try {
          const res = await authFetch('/api/dashboard', {
            method: 'POST',
            body: JSON.stringify({ action: 'dosp_lookup', processNumber: proc.process_number })
          });
          const json = await res.json();
          setDospModal(prev => ({
            ...prev,
            loading: false,
            result: json,
            error: json.ok ? null : (json.error || 'Erro na consulta ao Diário Oficial')
          }));
        } catch (err) {
          setDospModal(prev => ({
            ...prev,
            loading: false,
            result: null,
            error: err.message || 'Falha na conexão com o Diário Oficial'
          }));
        }
      };

      // Modal de Alteração de Senha
      const [isPasswordModalOpen, setIsPasswordModalOpen] = useState(false);
      const [passwordForm, setPasswordForm] = useState({
        currentPassword: '',
        newPassword: '',
        confirmPassword: ''
      });
      const [passwordError, setPasswordError] = useState('');
      const [submittingPassword, setSubmittingPassword] = useState(false);

      const handleChangePasswordSubmit = async (e) => {
        e.preventDefault();
        setPasswordError('');

        if (!passwordForm.currentPassword || !passwordForm.newPassword) {
          setPasswordError('Preencha a senha atual e a nova senha.');
          return;
        }
        if (passwordForm.newPassword.length < 4) {
          setPasswordError('A nova senha deve ter no mínimo 4 caracteres.');
          return;
        }
        if (passwordForm.newPassword !== passwordForm.confirmPassword) {
          setPasswordError('A nova senha e a confirmação não coincidem.');
          return;
        }

        setSubmittingPassword(true);
        try {
          const res = await authFetch('/api/dashboard', {
            method: 'POST',
            body: JSON.stringify({
              action: 'change_password',
              currentPassword: passwordForm.currentPassword,
              newPassword: passwordForm.newPassword,
              username: authUser
            })
          });
          const json = await res.json();
          if (!res.ok || !json.ok) {
            throw new Error(json.error || 'Erro ao alterar senha.');
          }

          showToast('🔑 Senha alterada com sucesso!');
          setIsPasswordModalOpen(false);
          setPasswordForm({ currentPassword: '', newPassword: '', confirmPassword: '' });
        } catch (err) {
          setPasswordError(err.message || 'Falha ao alterar senha.');
        } finally {
          setSubmittingPassword(false);
        }
      };

      const previousPendingRef = useRef(null);

      // Carrega dados da API (com suporte a Realtime Polling de milissegundos)
      const fetchData = async (silent = false) => {
        if (!authToken) return;
        if (!silent) setLoading(true);
        try {
          const res = await authFetch('/api/dashboard');
          if (!res.ok) throw new Error('Falha ao obter dados da API');
          const json = await res.json();
          if (json.ok) {
            // Detecção de mudança em tempo real para avisar o usuário
            if (previousPendingRef.current !== null && previousPendingRef.current !== json.metrics.pending) {
              if (json.metrics.pending < previousPendingRef.current) {
                showToast('✅ Um prazo foi concluído com sucesso!', 'success');
                sendBrowserNotification('✅ Prazo Concluído', 'Um processo ou prazo de arquitetura foi concluído.');
              } else if (json.metrics.pending > previousPendingRef.current) {
                showToast('📌 Novo prazo cadastrado no painel!', 'info');
                sendBrowserNotification('📌 Novo Prazo Cadastrado', 'Um novo processo ou prazo foi adicionado.');
              }
            }
            previousPendingRef.current = json.metrics.pending;

            // Alerta Diário no Navegador de Prazos Críticos (Estilo Google Notificações)
            if (json.metrics) {
              const overdueCount = json.metrics.overdue || 0;
              const todayCount = json.metrics.today || 0;
              const totalCritical = overdueCount + todayCount;
              if (totalCritical > 0) {
                const todayStr = json.todaySaoPaulo || new Date().toISOString().slice(0, 10);
                const lastAlert = localStorage.getItem('prazos_last_daily_alert');
                if (lastAlert !== todayStr) {
                  localStorage.setItem('prazos_last_daily_alert', todayStr);
                  sendBrowserNotification(
                    '⚠️ Alerta de Prazos Vencendo!',
                    `Atenção: Você tem ${todayCount} prazo(s) vencendo hoje e ${overdueCount} em atraso no painel.`
                  );
                }
              }
            }

            setData(json);
            if (json.teamMembers && json.teamMembers.length > 0) {
              setNewForm(prev => ({
                ...prev,
                owner_name: prev.owner_name || json.teamMembers[0].name,
                owner_telegram_id: prev.owner_telegram_id || json.teamMembers[0].telegram_user_id
              }));
              if (!completingUser) {
                setCompletingUser(json.teamMembers[0].name);
              }
            }
          }
        } catch (err) {
          if (!silent) showToast('Erro ao carregar dados: ' + err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      // REALTIME DE ALTA VELOCIDADE (Milissegundos & Foco Instantâneo)
      useEffect(() => {
        if (!authToken) return;
        fetchData();

        // Polling ultra rápido a cada 2 segundos quando a aba estiver visível
        const interval = setInterval(() => {
          if (document.visibilityState === 'visible') {
            fetchData(true);
          }
        }, 2000);

        // Atualização instantânea em 0ms ao clicar de volta na aba
        const onFocus = () => fetchData(true);
        const onVisibility = () => {
          if (!document.hidden) fetchData(true);
        };
        window.addEventListener('focus', onFocus);
        document.addEventListener('visibilitychange', onVisibility);

        return () => {
          clearInterval(interval);
          window.removeEventListener('focus', onFocus);
          document.removeEventListener('visibilitychange', onVisibility);
        };
      }, [authToken]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        showToast(`Processo ${text} copiado!`);
      };

      // Lista unificada de membros da equipe (garante que Anderson e outros apareçam sempre)
      const availableMembers = useMemo(() => {
        const map = new Map();
        (data.teamMembers || []).forEach(m => {
          if (m && m.name) map.set(m.name.trim(), m);
        });
        Object.keys(data.memberStats || {}).forEach(name => {
          if (name && name !== 'Sem Responsável' && !map.has(name.trim())) {
            map.set(name.trim(), {
              name: name.trim(),
              telegram_user_id: `unassigned_${name.trim().toLowerCase().replace(/\s+/g, '_')}`
            });
          }
        });
        return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));
      }, [data.teamMembers, data.memberStats]);

      // Filtragem e Ordenação
      const filteredProcesses = useMemo(() => {
        let list = [...(data.processes || [])];

        if (searchTerm.trim()) {
          const q = searchTerm.toLowerCase();
          list = list.filter(p =>
            (p.client_name && p.client_name.toLowerCase().includes(q)) ||
            (p.process_number && p.process_number.toLowerCase().includes(q)) ||
            (p.deadline_info && p.deadline_info.toLowerCase().includes(q)) ||
            (p.owner_name && p.owner_name.toLowerCase().includes(q))
          );
        }

        if (selectedMember !== 'ALL') {
          list = list.filter(p => p.owner_name === selectedMember);
        }

        if (statusFilter === 'PENDENTE') {
          list = list.filter(p => p.status === 'PENDENTE');
        } else if (statusFilter === 'ATRASADO') {
          list = list.filter(p => p.status === 'PENDENTE' && p.daysRemaining < 0);
        } else if (statusFilter === 'HOJE') {
          list = list.filter(p => p.status === 'PENDENTE' && p.daysRemaining === 0);
        } else if (statusFilter === 'SEMANA') {
          list = list.filter(p => p.status === 'PENDENTE' && p.daysRemaining > 0 && p.daysRemaining <= 7);
        } else if (statusFilter === 'CONCLUIDO') {
          list = list.filter(p => p.status === 'CONCLUIDO');
        }

        list.sort((a, b) => {
          if (sortBy === 'urgency') {
            if (a.status === 'CONCLUIDO' && b.status !== 'CONCLUIDO') return 1;
            if (a.status !== 'CONCLUIDO' && b.status === 'CONCLUIDO') return -1;
            return a.daysRemaining - b.daysRemaining;
          }
          if (sortBy === 'created_desc') {
            return new Date(b.created_at || 0) - new Date(a.created_at || 0);
          }
          if (sortBy === 'client_asc') {
            return (a.client_name || '').localeCompare(b.client_name || '');
          }
          return 0;
        });

        return list;
      }, [data.processes, searchTerm, selectedMember, statusFilter, sortBy]);

      // Ação: Concluir Prazo (com atualização otimista instantânea em 0ms)
      const handleCompleteSubmit = async () => {
        if (!completingItem) return;
        setSubmittingComplete(true);

        // Atualização Otimista Instantânea (0ms na tela)
        setData(prev => ({
          ...prev,
          processes: prev.processes.map(p => 
            p.id === completingItem.id 
              ? { ...p, status: 'CONCLUIDO', completed_by: completingUser || 'Dashboard Web', completedDateFormatted: 'Hoje' } 
              : p
          ),
          metrics: {
            ...prev.metrics,
            pending: Math.max(0, prev.metrics.pending - 1),
            completed: prev.metrics.completed + 1
          }
        }));

        try {
          const res = await authFetch('/api/dashboard', {
            method: 'POST',
            body: JSON.stringify({
              action: 'complete',
              processId: completingItem.id,
              completedBy: completingUser || 'Dashboard Web',
            })
          });
          const json = await res.json();
          if (!res.ok || !json.ok) throw new Error(json.error || 'Erro ao concluir prazo');

          showToast(`Prazo #${completingItem.id} concluído com sucesso!`);
          sendBrowserNotification(
            '✅ Prazo Concluído com Sucesso!',
            `Processo: ${completingItem.process_number} (${completingItem.client_name}) foi finalizado.`
          );
          setCompletingItem(null);
          fetchData(true);
        } catch (err) {
          showToast('Erro ao concluir: ' + err.message, 'error');
          fetchData(true);
        } finally {
          setSubmittingComplete(false);
        }
      };

      // Ação: Criar Novo Prazo
      const handleNewSubmit = async (e) => {
        e.preventDefault();
        if (!newForm.process_number || !newForm.client_name || !newForm.deadline_info || !newForm.due_date) {
          showToast('Preencha todos os campos obrigatórios!', 'error');
          return;
        }
        setSubmittingNew(true);
        try {
          const res = await authFetch('/api/dashboard', {
            method: 'POST',
            body: JSON.stringify({ action: 'create', ...newForm })
          });
          const json = await res.json();
          if (!res.ok || !json.ok) throw new Error(json.error || 'Erro ao criar prazo');

          showToast(`Novo prazo cadastrado com sucesso!`);
          sendBrowserNotification(
            '📌 Novo Prazo Cadastrado!',
            `Processo: ${newForm.process_number || 'S/N'} • ${newForm.client_name}\nVencimento: ${formatDateBR(newForm.due_date)}`
          );
          setIsNewModalOpen(false);
          setNewForm({
            process_number: '',
            client_name: '',
            deadline_info: '',
            owner_name: availableMembers[0]?.name || '',
            owner_telegram_id: availableMembers[0]?.telegram_user_id || '',
            due_date: '',
            remind_days_before: 3,
          });
          fetchData(true);
        } catch (err) {
          showToast('Erro ao criar: ' + err.message, 'error');
        } finally {
          setSubmittingNew(false);
        }
      };

      // Ação: Editar / Prorrogar Prazo
      const handleEditSubmit = async (e) => {
        e.preventDefault();
        if (!editForm.id || !editForm.due_date) {
          showToast('Data de vencimento é obrigatória!', 'error');
          return;
        }
        setSubmittingEdit(true);
        try {
          const res = await authFetch('/api/dashboard', {
            method: 'POST',
            body: JSON.stringify({ action: 'update', ...editForm })
          });
          const json = await res.json();
          if (!res.ok || !json.ok) throw new Error(json.error || 'Erro ao atualizar');

          showToast(`Prazo #${editForm.id} atualizado com sucesso!`);
          sendBrowserNotification(
            '✏️ Prazo Atualizado',
            `Processo: ${editForm.process_number || editForm.id} teve vencimento atualizado para ${formatDateBR(editForm.due_date)}.`
          );
          setEditingItem(null);

        const headers = ['ID;Número do Processo;Cliente;Prazo;Responsável;Status;Data de Inclusão;Data de Vencimento;Dias Restantes;Concluído Por;Data da Baixa'];
        const rows = filteredProcesses.map(p => {
          return [
            p.id,
            `"${p.process_number || ''}"`,
            `"${p.client_name || ''}"`,
            `"${p.deadline_info || ''}"`,
            `"${p.owner_name || ''}"`,

            p.status === 'CONCLUIDO' ? '0' : p.daysRemaining,
            `"${p.completed_by || ''}"`,
            p.completedDateFormatted || ''

        });

        const csvContent = '\uFEFF' + headers.concat(rows).join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });

                            )}
                          </div>

                          <div className="text-xs text-slate-500 dark:text-slate-400 flex items-center space-x-1">
                            <span>🏛️ <strong>Órgão:</strong> {pub.orgao}</span>
                          </div>

                          {pub.trecho && (
                            <p className="text-xs sm:text-sm text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 p-3 rounded-xl border border-slate-200/80 dark:border-slate-800 leading-relaxed font-mono">
                              {pub.trecho}
                            </p>
                          )}
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="py-8 text-center space-y-3">
                      <div className="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center mx-auto text-slate-400">
                        <Icon name="newspaper" className="w-6 h-6" />
                      </div>
                      <h3 className="text-base font-bold text-slate-800 dark:text-slate-200">
                        Nenhum despacho recente publicado
                      </h3>
                      <p className="text-xs text-slate-500 dark:text-slate-400 max-w-md mx-auto">
                        Não encontramos decisões ou despachos novos publicados para o processo <strong className="font-mono text-slate-700 dark:text-slate-300">{dospModal.processNumber}</strong> na consulta do Diário Oficial da Prefeitura.
                      </p>
                    </div>
                  )}
                </div>

                {/* Rodapé com Ações */}
                <div className="px-6 py-4 bg-slate-50/80 dark:bg-slate-900/80 border-t border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
                  <button
                    onClick={() => openDospFilteredPost(dospModal.processNumber)}
                    className="py-2 px-3.5 rounded-xl text-xs font-semibold bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800 hover:bg-emerald-100 dark:hover:bg-emerald-900/60 transition-all flex items-center space-x-1.5 shadow-sm"
                    title="Abrir no portal da Prefeitura já pesquisado"
                  >
                    <Icon name="external-link" className="w-3.5 h-3.5" />
                    <span>Ver no Diário Oficial da Prefeitura</span>
                  </button>

                  <button
                    onClick={() => setDospModal(prev => ({ ...prev, open: false }))}
                    className="py-2 px-4 rounded-xl text-xs font-semibold bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 transition-all"
                  >
                    Fechar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 5: ALTERAR SENHA DE ACESSO */}
          {isPasswordModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/75 backdrop-blur-sm no-print animate-in fade-in duration-150">
              <div className="glass-card rounded-3xl w-full max-w-md border border-slate-300 dark:border-slate-700 shadow-2xl bg-white dark:bg-slate-900 p-6 sm:p-7 relative">
                <button
                  onClick={() => setIsPasswordModalOpen(false)}
                  className="absolute right-4 top-4 text-slate-400 hover:text-slate-600 dark:hover:text-white p-1 rounded-lg"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div className="flex items-center space-x-3 mb-5">
                  <div className="w-11 h-11 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-600 dark:text-amber-400">
                    <Icon name="key" className="w-6 h-6" />
                  </div>
                  <div>
                    <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white">Alterar Senha</h2>
                    <p className="text-xs text-slate-500 dark:text-slate-400">Usuário: <strong className="font-semibold text-slate-700 dark:text-slate-200">{authUser}</strong></p>
                  </div>
                </div>

                {passwordError && (
                  <div className="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center space-x-2">
                    <Icon name="alert-triangle" className="w-4 h-4 text-rose-400 shrink-0" />
                    <span>{passwordError}</span>
                  </div>
                )}

                <form onSubmit={handleChangePasswordSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">
                      Senha Atual
                    </label>
                    <input
                      type="password"
                      required
                      value={passwordForm.currentPassword}
                      onChange={e => setPasswordForm(p => ({ ...p, currentPassword: e.target.value }))}
                      placeholder="Digite sua senha atual"
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">
                      Nova Senha
                    </label>
                    <input
                      type="password"
                      required
                      minLength={4}
                      value={passwordForm.newPassword}
                      onChange={e => setPasswordForm(p => ({ ...p, newPassword: e.target.value }))}
                      placeholder="Mínimo 4 caracteres"
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">
                      Confirmar Nova Senha
                    </label>
                    <input
                      type="password"
                      required
                      minLength={4}
                      value={passwordForm.confirmPassword}
                      onChange={e => setPasswordForm(p => ({ ...p, confirmPassword: e.target.value }))}
                      placeholder="Repita a nova senha"
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  <div className="flex items-center justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsPasswordModalOpen(false)}
                      className="px-4 py-2 text-xs sm:text-sm font-medium rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      disabled={submittingPassword}
                      className="px-5 py-2 text-xs sm:text-sm font-semibold rounded-xl bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-white shadow-lg shadow-amber-600/30 flex items-center space-x-1.5"
                    >
                      {submittingPassword ? (
                        <>
                          <Icon name="loader" className="w-4 h-4 animate-spin" />
                          <span>Salvando...</span>
                        </>
                      ) : (
                        <>
                          <Icon name="check" className="w-4 h-4" />
                          <span>Salvar Nova Senha</span>
                        </>
                      )}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Toast de Notificação */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 flex items-center space-x-2 px-4 py-3 rounded-xl shadow-2xl text-xs sm:text-sm font-medium border backdrop-blur-md no-print ${
              toast.type === 'error' 
                ? 'bg-rose-950/90 text-rose-200 border-rose-500/40' 
                : toast.type === 'info'
                  ? 'bg-indigo-950/90 text-indigo-200 border-indigo-500/40'
                  : 'bg-emerald-950/90 text-emerald-200 border-emerald-500/40'
            }`}>
              <Icon name={toast.type === 'error' ? 'alert-triangle' : toast.type === 'info' ? 'clock' : 'check-circle'} className="w-4 h-4" />
              <span>{toast.message}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DashboardApp />);
  </script>
</body>
</html>
